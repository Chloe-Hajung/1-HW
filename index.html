<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRS - 이혼 이후의 삶을 위한 커뮤니티</title>
<style>
:root{
  --primary:#4b67d1;
  --primary-light:#6d8ef7;
  --primary-lighter:#86b4ff;
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#2b2f38;
  --text-soft:#6b7280;
  --border:#e7eaf3;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
.container{max-width:1160px;margin:auto;padding:0 24px;}

/* ---------- Header ---------- */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.nav{
  max-width:1160px;
  margin:auto;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font-size:22px;
  font-weight:800;
  color:var(--primary);
  letter-spacing:-0.5px;
}
.nav-links{
  display:flex;
  gap:32px;
  font-size:15px;
  font-weight:500;
  color:var(--text);
}
.nav-links a:hover{color:var(--primary);}
.nav-actions{display:flex;gap:10px;align-items:center;}
.btn{
  display:inline-block;
  padding:10px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  border:none;
  transition:.15s ease;
}
.btn-ghost{
  background:transparent;
  color:var(--primary);
  border:1px solid var(--border);
}
.btn-ghost:hover{background:#f0f3ff;}
.btn-primary{
  background:linear-gradient(135deg,var(--primary-light),var(--primary-lighter));
  color:#fff;
  box-shadow:0 6px 16px rgba(109,142,247,.35);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(109,142,247,.45);}
.hamburger{display:none;font-size:22px;background:none;border:none;color:var(--primary);}
